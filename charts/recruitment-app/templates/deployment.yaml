apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.recruitmentApp.name }}
  labels:
    {{- include "recruitment.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.recruitmentApp.replicas }}
  selector:
    matchLabels:
      app: {{ .Values.recruitmentApp.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.recruitmentApp.name }}
    spec:
      containers:
        - name: recruitment-app
          image: "{{ .Values.recruitmentApp.image.repository }}:{{ .Values.recruitmentApp.image.tag }}"
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: {{ .Values.recruitmentApp.containerPort }}

          env:
            - name: MONGO_URL
              value: {{ .Values.recruitmentApp.env.MONGO_URL | quote }}
            - name: NODE_ENV
              value: {{ .Values.recruitmentApp.env.NODE_ENV | quote }}
            - name: PORT
              value: {{ .Values.recruitmentApp.containerPort | quote }}

          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          # Pod is READY only when MongoDB is connected
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.recruitmentApp.containerPort }}
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 6

          # Pod is ALIVE as long as the app process is running
          livenessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.recruitmentApp.containerPort }}
            initialDelaySeconds: 60
            periodSeconds: 20
